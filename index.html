<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daniel Harianto explores the relationships between people and space through design and computation. Selected projects in urbanism, architecture, and computational design." />
  <link rel="icon" type="image/png" href="Image/Logo.png" />
  <title>Daniel Harianto — Design & Computation</title>
  <link rel="stylesheet" href="portfolio.css" />
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
  <link rel="stylesheet" href="typography.css" />
</head>
<body class="home-page">
  <a class="skip-link" href="#work">Skip to work</a>
  <header class="site-header">
    <a href="index.html" class="brand" aria-label="Latent Territories home"><img class="brand-image" src="Image/Logo_Main.png" alt="Latent Territories" /></a>
    <p class="site-name">Daniel Harianto</p>
</header>
  <main>
    <section class="intro" aria-labelledby="intro-title">
      <h1 id="intro-title">I explore the relationships between people and space using design and computation</h1>
    </section>
    <section class="home-slideshow" aria-label="Featured projects" aria-roledescription="carousel">
      <div id="heroSlides" class="hero-slides"></div>
      <div id="heroDots" class="hero-dots" aria-label="Choose featured project"></div>
    </section>
    <section class="work" id="work" aria-label="Selected work">
      <div class="work-toolbar">
        <div class="filters" role="group" aria-label="Filter projects">

          <button type="button" data-filter="all" aria-pressed="true">all</button>
          <button type="button" data-filter="urbanism" aria-pressed="false">urbanism</button>
          <button type="button" data-filter="architecture" aria-pressed="false">architecture</button>
          <button type="button" data-filter="computation" aria-pressed="false">computation</button>
          <button type="button" data-filter="writing" aria-pressed="false">writing</button>
        </div>
        <a class="about-tab" href="about.html">about</a>
      </div>
      <p id="project-count" class="sr-only" role="status" aria-live="polite"></p>
      <div id="projectGrid" class="project-list"></div>
      <noscript><p>Enable JavaScript to browse the project archive. You can also <a href="about.html">read about Daniel</a>.</p></noscript>
    </section>
  </main>
  <footer class="site-footer">
    <span>© 2026 Daniel Harianto</span>
    <div class="footer-links">
      <a href="https://linkedin.com/in/daniel-j-harianto" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      <a href="https://github.com/danieljharianto" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      <a href="https://instagram.com/danielharianto_" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
      <a href="mailto:djansenh@mit.edu">Email ↗</a>
    </div>
  </footer>
</body>
</html>
